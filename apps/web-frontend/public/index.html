<!DOCTYPE html>
<html lang="ko">
  <head>
    <%= VUE_APP_EXTRA_HEAD_CONTENT %>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>별무리 – 밤하늘 배우기와 오늘 밤 관측 플래너</title>
    <meta name="description" content="별자리와 밤하늘을 레슨으로 배웁니다. 설명이 넘어갈 때마다 화면의 하늘이 그에 맞춰 움직이고, 그 하늘은 지금 내 위치의 실제 하늘이라 오늘 밤 밖에서 그대로 확인할 수 있습니다. 무료, 광고 없음, 오픈소스.">
    <meta name="keywords" content="별무리, 별자리 공부, 밤하늘 배우기, 별자리, 별자리 지도, 밤하늘, 별지도, 천체관측, 관측계획, 플라네타리움, 오늘 밤하늘, 성운, 성단, 은하, 행성, 달, 천문">
    <link rel="canonical" href="https://byeolmuri.codingteading.com/">

    <!--
      네이버 서치어드바이저 사이트 소유 확인. 값은 호스트 전용이라 다른 사이트에
      옮겨 쓸 수 없다. 네이버는 **등록한 주소에서** 이 메타를 찾으므로 루트 응답에
      실려야 한다 — 여기(한국어 원문)에 두면 tools/make-lang-html.mjs 가 언어판을
      구울 때 통째로 복사해 가므로 /en/ 같은 주소로 등록해도 통한다. 그 스크립트는
      title·description·og·canonical 만 갈아 끼우고 이 줄은 건드리지 않는다.
    -->
    <meta name="naver-site-verification" content="ecbb7a1cca85a90b6567c749c90298128fba4c31">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="별무리">
    <meta property="og:title" content="별무리 – 밤하늘 배우기와 오늘 밤 관측 플래너">
    <meta property="og:description" content="설명에 맞춰 하늘이 움직이는 레슨으로 밤하늘을 배웁니다. 화면의 하늘은 지금 내 위치의 실제 하늘입니다.">
    <meta property="og:url" content="https://byeolmuri.codingteading.com/">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:image" content="https://byeolmuri.codingteading.com/og/v3/ko.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="별무리 – 밤하늘을 읽는 법을 배웁니다">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://byeolmuri.codingteading.com/og/v3/ko.jpg">

    <link href="https://fonts.googleapis.com/css?family=Roboto:100,300,400,500,700,900" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>favicon.svg">
    <link rel="icon" type="image/x-icon" href="<%= BASE_URL %>favicon.ico">
    <meta name="theme-color" content="#000"/>
    <style type="text/css">
    #nightmode {
      background: #ff2200;
      pointer-events: none;
      height: 100vh;
      width: 100vw;
      position: absolute;
      z-index: 1000;
      mix-blend-mode: multiply;
      visibility: hidden;
    }
    </style>
  </head>
  <body>
    <div id="nightmode"></div>
    <noscript>
      <strong>별무리는 자바스크립트가 있어야 동작합니다. 브라우저에서 자바스크립트를 켜주세요.</strong>
    </noscript>
    <div id="app">

    </div>
