<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="별무리">
  <title>별무리</title>
  <!--
    플레이아데스 성단(좀생이별)의 실제 별 배치를 적경/적위에서 접평면으로
    투영해 그린 것이다. 별무리는 곧 성단이고, 한국에서 가장 널리 알려진
    별무리가 좀생이별이라 이름과 형태가 맞물린다.
    원의 크기는 실제 겉보기 등급을 따른다 (알키오네 2.9등급 ~ 켈라이노 5.4등급).
  -->
  <g fill="none" stroke="currentColor" stroke-width="0.9" stroke-linecap="round" opacity="0.32">
    <path d="M48.4 21.7 L42.6 25.7 L27.5 36.4 L12.2 38.4"/>
    <path d="M48.4 21.7 L51.4 35.7 L38.0 42.4 L27.5 36.4"/>
  </g>
  <g fill="currentColor">
    <circle cx="27.5" cy="36.4" r="3.1"/>
    <circle cx="12.2" cy="38.4" r="2.5"/>
    <circle cx="51.4" cy="35.7" r="2.4"/>
    <circle cx="42.6" cy="25.7" r="2.2"/>
    <circle cx="38.0" cy="42.4" r="2.1"/>
    <circle cx="48.4" cy="21.7" r="2.0"/>
    <circle cx="12.0" cy="35.1" r="1.5"/>
    <circle cx="52.0" cy="29.1" r="1.4"/>
  </g>
</svg>
